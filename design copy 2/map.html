<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>맛집 지도 - 지도 보기</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&libraries=places"></script>
  </head>
  <body class="bg-black text-white">
    <!-- 헤더 -->
    <header class="flex justify-between items-center px-6 py-4 bg-black border-b border-gray-800">
      <div class="flex items-center gap-4">
        <div class="text-red-500 font-bold text-xl">🍽️ 맛집지도</div>
        <nav class="flex gap-4 text-sm text-gray-300">
          <a href="list.html" class="hover:text-white">홈</a>
          <a href="#" class="text-white">지도</a>
          <a href="#" class="hover:text-white">찜</a>
          <a href="#" class="hover:text-white">방문기록</a>
        </nav>
      </div>
      <div class="flex items-center gap-4">
        <button class="text-gray-300 hover:text-white">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
          </svg>
        </button>
        <button class="text-gray-300 hover:text-white">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-5 5v-5z"></path>
          </svg>
        </button>
        <div class="w-8 h-8 bg-gray-700 rounded-full"></div>
      </div>
    </header>

    <!-- 검색 바 -->
    <div class="px-6 py-4 bg-black border-b border-gray-800">
      <div class="flex items-center gap-2">
        <div class="flex-1 relative">
          <input 
            type="text" 
            placeholder="지역, 맛집명 검색" 
            class="w-full px-4 py-2 bg-gray-800 text-white rounded-full text-sm pl-10" 
          />
          <svg class="w-4 h-4 absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
          </svg>
        </div>
        <button class="p-2 bg-gray-800 rounded-full">
          <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path>
          </svg>
        </button>
      </div>
    </div>

    <!-- 본문 -->
    <main class="relative h-screen">
      <!-- 지도 컨테이너 -->
      <div id="map" class="w-full h-full"></div>
      
      <!-- 지도 오버레이 컨트롤 -->
      <div class="absolute top-4 left-4 bg-black bg-opacity-90 rounded-lg p-4">
        <div class="text-white text-sm font-medium mb-3">맛집 필터</div>
        <div class="space-y-2">
          <label class="flex items-center gap-2 text-xs">
            <input type="checkbox" checked class="accent-red-500" />
            <span class="text-white">일식</span>
          </label>
          <label class="flex items-center gap-2 text-xs">
            <input type="checkbox" checked class="accent-red-500" />
            <span class="text-white">한식</span>
          </label>
          <label class="flex items-center gap-2 text-xs">
            <input type="checkbox" checked class="accent-red-500" />
            <span class="text-white">중식</span>
          </label>
          <label class="flex items-center gap-2 text-xs">
            <input type="checkbox" checked class="accent-red-500" />
            <span class="text-white">양식</span>
          </label>
          <label class="flex items-center gap-2 text-xs">
            <input type="checkbox" checked class="accent-red-500" />
            <span class="text-white">디저트</span>
          </label>
          <label class="flex items-center gap-2 text-xs">
            <input type="checkbox" checked class="accent-red-500" />
            <span class="text-white">술집</span>
          </label>
        </div>
      </div>

      <!-- 현재 위치 버튼 -->
      <button class="absolute top-4 right-4 bg-black bg-opacity-90 text-white p-3 rounded-full hover:bg-opacity-100">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path>
        </svg>
      </button>

      <!-- 줌 컨트롤 -->
      <div class="absolute top-20 right-4 bg-black bg-opacity-90 rounded-lg p-2">
        <button class="block w-8 h-8 bg-gray-700 text-white rounded mb-1 hover:bg-gray-600">
          <svg class="w-4 h-4 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path>
          </svg>
        </button>
        <button class="block w-8 h-8 bg-gray-700 text-white rounded hover:bg-gray-600">
          <svg class="w-4 h-4 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4"></path>
          </svg>
        </button>
      </div>

      <!-- 맛집 목록 토글 버튼 -->
      <button id="listToggle" class="absolute bottom-4 left-4 bg-red-600 text-white px-4 py-2 rounded-lg hover:bg-red-700">
        <span id="listToggleText">목록 보기</span>
      </button>

      <!-- 맛집 목록 패널 -->
      <div id="restaurantList" class="absolute bottom-0 left-0 right-0 bg-black bg-opacity-95 rounded-t-lg p-4 hidden">
        <div class="flex justify-between items-center mb-4">
          <h3 class="text-lg font-semibold text-white">주변 맛집</h3>
          <button id="closeList" class="text-gray-400 hover:text-white">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
          </button>
        </div>
        <div class="space-y-3 max-h-64 overflow-y-auto">
          <!-- 맛집 아이템 1 -->
          <div class="flex items-center gap-3 p-3 bg-gray-800 rounded-lg cursor-pointer hover:bg-gray-700">
            <div class="w-12 h-12 bg-red-600 rounded-full flex items-center justify-center">
              <span class="text-white text-lg">🍽️</span>
            </div>
            <div class="flex-1">
              <h4 class="text-white font-medium">강남역 이자카야 하나</h4>
              <p class="text-xs text-gray-400">일식 • 유튜버 3명 방문</p>
              <p class="text-xs text-gray-500">조회수 12.5만회</p>
            </div>
            <button class="text-red-400 text-xs">상세보기</button>
          </div>

          <!-- 맛집 아이템 2 -->
          <div class="flex items-center gap-3 p-3 bg-gray-800 rounded-lg cursor-pointer hover:bg-gray-700">
            <div class="w-12 h-12 bg-blue-600 rounded-full flex items-center justify-center">
              <span class="text-white text-lg">🍰</span>
            </div>
            <div class="flex-1">
              <h4 class="text-white font-medium">홍대 디저트 카페</h4>
              <p class="text-xs text-gray-400">디저트 • 유튜버 5명 방문</p>
              <p class="text-xs text-gray-500">조회수 8.2만회</p>
            </div>
            <button class="text-red-400 text-xs">상세보기</button>
          </div>

          <!-- 맛집 아이템 3 -->
          <div class="flex items-center gap-3 p-3 bg-gray-800 rounded-lg cursor-pointer hover:bg-gray-700">
            <div class="w-12 h-12 bg-green-600 rounded-full flex items-center justify-center">
              <span class="text-white text-lg">🍺</span>
            </div>
            <div class="flex-1">
              <h4 class="text-white font-medium">신촌 술집</h4>
              <p class="text-xs text-gray-400">술집 • 유튜버 2명 방문</p>
              <p class="text-xs text-gray-500">조회수 5.7만회</p>
            </div>
            <button class="text-red-400 text-xs">상세보기</button>
          </div>

          <!-- 맛집 아이템 4 -->
          <div class="flex items-center gap-3 p-3 bg-gray-800 rounded-lg cursor-pointer hover:bg-gray-700">
            <div class="w-12 h-12 bg-yellow-600 rounded-full flex items-center justify-center">
              <span class="text-white text-lg">🍚</span>
            </div>
            <div class="flex-1">
              <h4 class="text-white font-medium">종로 한식 맛집</h4>
              <p class="text-xs text-gray-400">한식 • 유튜버 7명 방문</p>
              <p class="text-xs text-gray-500">조회수 15.3만회</p>
            </div>
            <button class="text-red-400 text-xs">상세보기</button>
          </div>
        </div>
      </div>
    </main>

    <script>
      // 지도 초기화
      function initMap() {
        // 서울 강남구 중심 좌표
        const seoul = { lat: 37.5665, lng: 126.9780 };
        
        const map = new google.maps.Map(document.getElementById('map'), {
          zoom: 13,
          center: seoul,
          styles: [
            {
              "featureType": "all",
              "elementType": "geometry",
              "stylers": [{"color": "#242f3e"}]
            },
            {
              "featureType": "all",
              "elementType": "labels.text.stroke",
              "stylers": [{"color": "#242f3e"}]
            },
            {
              "featureType": "all",
              "elementType": "labels.text.fill",
              "stylers": [{"color": "#746855"}]
            },
            {
              "featureType": "administrative.locality",
              "elementType": "labels.text.fill",
              "stylers": [{"color": "#d59563"}]
            },
            {
              "featureType": "poi",
              "elementType": "labels.text.fill",
              "stylers": [{"color": "#d59563"}]
            },
            {
              "featureType": "poi.park",
              "elementType": "geometry",
              "stylers": [{"color": "#263c3f"}]
            },
            {
              "featureType": "poi.park",
              "elementType": "labels.text.fill",
              "stylers": [{"color": "#6b9a76"}]
            },
            {
              "featureType": "road",
              "elementType": "geometry",
              "stylers": [{"color": "#38414e"}]
            },
            {
              "featureType": "road",
              "elementType": "geometry.stroke",
              "stylers": [{"color": "#212a37"}]
            },
            {
              "featureType": "road",
              "elementType": "labels.text.fill",
              "stylers": [{"color": "#9ca5b3"}]
            },
            {
              "featureType": "road.highway",
              "elementType": "geometry",
              "stylers": [{"color": "#746855"}]
            },
            {
              "featureType": "road.highway",
              "elementType": "geometry.stroke",
              "stylers": [{"color": "#1f2835"}]
            },
            {
              "featureType": "road.highway",
              "elementType": "labels.text.fill",
              "stylers": [{"color": "#f3d19c"}]
            },
            {
              "featureType": "transit",
              "elementType": "geometry",
              "stylers": [{"color": "#2f3948"}]
            },
            {
              "featureType": "transit.station",
              "elementType": "labels.text.fill",
              "stylers": [{"color": "#d59563"}]
            },
            {
              "featureType": "water",
              "elementType": "geometry",
              "stylers": [{"color": "#17263c"}]
            },
            {
              "featureType": "water",
              "elementType": "labels.text.fill",
              "stylers": [{"color": "#515c6d"}]
            },
            {
              "featureType": "water",
              "elementType": "labels.text.stroke",
              "stylers": [{"color": "#17263c"}]
            }
          ]
        });

        // 맛집 마커 데이터
        const restaurants = [
          {
            position: { lat: 37.5665, lng: 126.9780 },
            title: "강남역 이자카야 하나",
            category: "일식",
            youtubers: 3,
            views: "12.5만회",
            icon: "🍽️"
          },
          {
            position: { lat: 37.5565, lng: 126.9280 },
            title: "홍대 디저트 카페",
            category: "디저트",
            youtubers: 5,
            views: "8.2만회",
            icon: "🍰"
          },
          {
            position: { lat: 37.5465, lng: 126.9380 },
            title: "신촌 술집",
            category: "술집",
            youtubers: 2,
            views: "5.7만회",
            icon: "🍺"
          },
          {
            position: { lat: 37.5765, lng: 126.9880 },
            title: "종로 한식 맛집",
            category: "한식",
            youtubers: 7,
            views: "15.3만회",
            icon: "🍚"
          },
          {
            position: { lat: 37.5365, lng: 126.9480 },
            title: "마포구 중식 맛집",
            category: "중식",
            youtubers: 4,
            views: "9.1만회",
            icon: "🥢"
          },
          {
            position: { lat: 37.5865, lng: 126.9980 },
            title: "강남 양식 맛집",
            category: "양식",
            youtubers: 6,
            views: "7.8만회",
            icon: "🍝"
          }
        ];

        // 맛집 마커 생성
        restaurants.forEach(restaurant => {
          const marker = new google.maps.Marker({
            position: restaurant.position,
            map: map,
            title: restaurant.title,
            icon: {
              url: 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(`
                <svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
                  <circle cx="20" cy="20" r="18" fill="#ef4444" stroke="#ffffff" stroke-width="2"/>
                  <text x="20" y="25" text-anchor="middle" fill="white" font-size="12" font-weight="bold">${restaurant.icon}</text>
                </svg>
              `),
              scaledSize: new google.maps.Size(40, 40)
            }
          });

          // 정보창 생성
          const infowindow = new google.maps.InfoWindow({
            content: `
              <div style="padding: 15px; min-width: 250px; background: white; border-radius: 8px;">
                <h3 style="margin: 0 0 8px 0; font-weight: bold; color: #333;">${restaurant.title}</h3>
                <p style="margin: 0 0 5px 0; color: #666;">${restaurant.category}</p>
                <p style="margin: 0 0 5px 0; color: #666;">유튜버 ${restaurant.youtubers}명 방문</p>
                <p style="margin: 0 0 10px 0; color: #666;">조회수 ${restaurant.views}</p>
                <div style="display: flex; gap: 8px;">
                  <button onclick="window.location.href='detail.html'" style="padding: 8px 12px; background: #ef4444; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px;">상세보기</button>
                  <button onclick="alert('찜했습니다!')" style="padding: 8px 12px; background: #6b7280; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px;">찜하기</button>
                </div>
              </div>
            `
          });

          // 마커 클릭 이벤트
          marker.addListener('click', () => {
            infowindow.open(map, marker);
          });
        });
      }

      // 목록 토글 기능
      const listToggle = document.getElementById('listToggle');
      const listToggleText = document.getElementById('listToggleText');
      const restaurantList = document.getElementById('restaurantList');
      const closeList = document.getElementById('closeList');

      listToggle.addEventListener('click', function() {
        if (restaurantList.classList.contains('hidden')) {
          restaurantList.classList.remove('hidden');
          listToggleText.textContent = '목록 숨기기';
        } else {
          restaurantList.classList.add('hidden');
          listToggleText.textContent = '목록 보기';
        }
      });

      closeList.addEventListener('click', function() {
        restaurantList.classList.add('hidden');
        listToggleText.textContent = '목록 보기';
      });

      // 페이지 로드 시 지도 초기화
      window.addEventListener('load', initMap);
    </script>
  </body>
</html>
